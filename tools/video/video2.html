<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#FFF6E9;overflow:hidden}svg{display:block;font-family:Inter,"Noto Sans",Arial,sans-serif}</style></head>
<body><div id="root"></div>
<script>
// Gerador genérico de vídeos de receitas (Livro de Receitas Fit do Chef). Lê window.RECIPE (uma receita de recipes.json).
const W=1280,H=720,R=window.RECIPE,V=R.video;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3),eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eob=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const pr=(t,a,b)=>clamp((t-a)/(b-a));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(t)))).join(',')+')'}
function dark(c,k){const A=hex(c);return '#'+A.map(v=>Math.round(v*(1-k)).toString(16).padStart(2,'0')).join('')}
const C={cream:'#FFF6E9',green:'#1F5F4A',greenD:'#14412F',tomato:'#E4572E',ink:'#2B2623',mut:'#7A6A5C'};
const ctx=document.createElement('canvas').getContext('2d');
function tw(text,size,weight){ctx.font=`${weight} ${size}px Inter`;return ctx.measureText(text).width}
function fit(lines,size,weight,maxW){let s=size;for(const l of lines){const w=tw(l,size,weight);if(w>maxW)s=Math.min(s,size*maxW/w)}return Math.floor(s)}
function wrap(text,size,weight,maxW){const words=text.split(' ');const out=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(tw(t,size,weight)>maxW&&cur){out.push(cur);cur=w}else cur=t}if(cur)out.push(cur);return out}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- containers ---------- */
const MX=935,MY=374;
function cKey(g){return (V.container==='bowl'||g.inn==='bowl')?'bowl':'dish'}
function geom(key){
 const t=key==='bowl'?'bowl':V.container;
 if(t==='tray')return {t,kind:'rect',w:500,h:340,rx:16};
 if(t==='muffin')return {t,kind:'rect',w:500,h:340,rx:16};
 if(t==='loaf')return {t,kind:'rect',w:440,h:170,rx:14};
 if(t==='round')return {t,kind:'circ',r:185};
 return {t:'bowl',kind:'circ',r:160};
}
const CUPS=[];for(let r=0;r<3;r++)for(let c=0;c<4;c++)CUPS.push([-187.5+c*125,-115+r*115]);
function containerBase(key,glow=0){
 const g=geom(key);let s=`<g transform="translate(${MX} ${MY})">`;
 if(g.t==='tray'||g.t==='muffin'){const TW=560,TH=400;
  s+=`<ellipse cx="0" cy="${TH/2+24}" rx="${TW/2+10}" ry="26" fill="rgba(0,0,0,.18)"/><rect x="${-TW/2}" y="${-TH/2}" width="${TW}" height="${TH}" rx="34" fill="#59616E"/><rect x="${-TW/2+8}" y="${-TH/2+8}" width="${TW-16}" height="${TH-16}" rx="27" fill="#7C8593"/>`;
  if(g.t==='tray')s+=`<rect x="-250" y="-170" width="500" height="340" rx="20" fill="#3F4651"/><rect x="-250" y="-170" width="500" height="340" rx="20" fill="#E8742A" opacity="${glow*.25}"/>`;
  else{s+=`<rect x="-250" y="-170" width="500" height="340" rx="20" fill="#6B7380"/>`;CUPS.forEach(c=>{s+=`<circle cx="${c[0]}" cy="${c[1]}" r="50" fill="#3F4651"/><circle cx="${c[0]}" cy="${c[1]}" r="50" fill="none" stroke="#4E5662" stroke-width="5"/>`})}
 }else if(g.t==='loaf'){
  s+=`<ellipse cx="0" cy="140" rx="280" ry="22" fill="rgba(0,0,0,.18)"/><rect x="-260" y="-125" width="520" height="250" rx="26" fill="#59616E"/><rect x="-250" y="-115" width="500" height="230" rx="20" fill="#7C8593"/><rect x="-220" y="-85" width="440" height="170" rx="14" fill="#3F4651"/><rect x="-224" y="-89" width="448" height="178" rx="16" fill="none" stroke="#F2EBDD" stroke-width="6" opacity=".9"/>`;
 }else if(g.t==='round'){
  s+=`<ellipse cx="0" cy="226" rx="230" ry="24" fill="rgba(0,0,0,.18)"/><circle r="215" fill="#40464F"/><circle r="203" fill="#5A616C"/><circle r="185" fill="#2F343B"/><circle r="185" fill="#E8742A" opacity="${glow*.22}"/>`;
 }else{
  s+=`<ellipse cx="0" cy="196" rx="200" ry="22" fill="rgba(0,0,0,.14)"/><circle r="190" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="4"/><circle r="165" fill="#F3ECE0"/><circle r="165" fill="none" stroke="#E2D6C3" stroke-width="3"/>`;
 }
 return s+'</g>';
}
/* ---------- groups / layout ---------- */
const GROUPS=V.groups.map((g,i)=>Object.assign({size:1,layout:'scatter',z:0,n:0,idx:i},g));
const GBY={};GROUPS.forEach(g=>GBY[g.id]=g);
const r1=rng(1234);
function inArea(G,x,y,pad){return G.kind==='rect'?(Math.abs(x)<=G.w/2-pad&&Math.abs(y)<=G.h/2-pad):(Math.hypot(x,y)<=G.r-pad)}
function randIn(G,pad,sub){ // sub: [k,K] sector
 for(let i=0;i<200;i++){let x,y;
  if(G.kind==='rect'){x=(r1()-.5)*G.w;y=(r1()-.5)*G.h;if(sub){const [k,K]=sub;x=-G.w/2+(k+r1())*G.w/K}}
  else{const a=sub?((sub[0]+r1())/sub[1])*Math.PI*2-Math.PI/2:r1()*Math.PI*2;const rr=Math.sqrt(r1())*G.r;x=Math.cos(a)*rr;y=Math.sin(a)*rr}
  if(inArea(G,x,y,pad))return [x,y]}
 return [0,0];
}
function bestIn(G,pad,sub,ex,k=8){let bp=null,bd=-1;for(let j=0;j<k;j++){const p=randIn(G,pad,sub);let d=1e9;for(const q of ex)d=Math.min(d,Math.hypot(p[0]-q[0],p[1]-q[1]));if(d>bd){bd=d;bp=p}}ex.push(bp);return bp}
const HASMIX={bowl:false,dish:false};V.steps.forEach(st=>{if(st.kind==='fill'&&st.mix)HASMIX[(st.target==='bowl'||V.container==='bowl')?'bowl':'dish']=true});
const ITEMS=[];
(function(){
 const exA={bowl:[],dish:[]},exB={bowl:[],dish:[]};
 const scatterByKey={bowl:[],dish:[]};GROUPS.forEach(g=>{if(g.layout==='scatter'&&g.shape!=='layer'&&g.shape!=='slicelines'&&g.z===0)scatterByKey[cKey(g)].push(g.id)});
 GROUPS.forEach(g=>{
  if(g.shape==='layer'||g.shape==='slicelines')return;
  const key=cKey(g),G=geom(key);const pad=G.t==='bowl'?30:18;
  for(let i=0;i<g.n;i++){
   const it={g,i,rot:r1()*360,curl:r1()*.6+.7,dx:(r1()-.5)*70,dy:(r1()-.5)*50,dr:(r1()-.5)*160,delay:r1(),seed:Math.floor(r1()*1e6)};
   if(G.t==='muffin'&&g.layout!=='grid'){const c=CUPS[i%12];const a=r1()*Math.PI*2,rr=Math.sqrt(r1())*30;it.A=it.B=[c[0]+Math.cos(a)*rr,c[1]+Math.sin(a)*rr]}
   else if(g.layout==='grid'){
    let p;
    if(G.t==='muffin'){const c=CUPS[i%12];p=g.n>12?[c[0]+(i<12?-14:14),c[1]+(i<12?-8:8)]:[c[0],c[1]]}
    else if(g.n===1)p=G.t==='bowl'?[70,-55]:[0,0];
    else if(G.kind==='circ'){const rr=G.r*.68*Math.sqrt((i+.5)/g.n);const a=i*2.39996+.4;p=[Math.cos(a)*rr,Math.sin(a)*rr]}
    else{let cols=Math.ceil(Math.sqrt(g.n*G.w/G.h));for(const c of [cols,cols-1,cols+1])if(c>0&&g.n%c===0&&g.n/c<=c+1){cols=c;break}const rows=Math.ceil(g.n/cols);const row=Math.floor(i/cols),col=i%cols;const inRow=row===rows-1?g.n-row*cols:cols;
     p=[(col-(inRow-1)/2)*(G.w/cols),(row-(rows-1)/2)*(G.h/rows)];p[0]+=(r1()-.5)*10;p[1]+=(r1()-.5)*10}
    it.A=it.B=p;if(g.shape!=='lemon'&&g.shape!=='fillet'&&g.shape!=='egg')it.rot=r1()*40-20;if(g.shape==='fillet'||g.shape==='egg'||g.shape==='blob')it.rot=r1()*30-15;
   }else{
    const sc=scatterByKey[key];const k=sc.indexOf(g.id);
    it.B=bestIn(G,pad,null,exB[key]);
    it.A=HASMIX[key]&&k>=0&&sc.length>1?bestIn(G,pad,[k,sc.length],exA[key]):it.B;
   }
   ITEMS.push(it);
  }
 });
 const o=rng(77);for(let i=ITEMS.length-1;i>0;i--){const j=Math.floor(o()*(i+1));[ITEMS[i],ITEMS[j]]=[ITEMS[j],ITEMS[i]]}
 ITEMS.sort((a,b)=>a.g.z-b.g.z);
})();
/* ---------- timeline ---------- */
const STEPS=V.steps;
function stepDur(s){if(s.dur)return s.dur;const nb=(s.batches||[]).length;
 if(s.kind==='preheat')return 4.5;if(s.kind==='fill')return .7+nb*1.7+(s.mix?2.6:0)+1.0;if(s.kind==='bake')return s.mid?11.5:8.5;if(s.kind==='top')return .7+nb*1.5+2.4;if(s.kind==='chill')return 5;return 5}
const nIngr=V.ingr.length;
const SC=[{k:'title',d:4},{k:'ingr',d:Math.max(6.5,1.2+nIngr*.5+2.2)}];
STEPS.forEach((s,j)=>SC.push({k:'step',j,d:stepDur(s)}));SC.push({k:'end',d:6.5});
// Durações mínimas por cena (para caber a narração): window.SCENE_DUR = [s0, s1, ...]
if(window.SCENE_DUR)SC.forEach((s,i)=>{if(window.SCENE_DUR[i])s.d=Math.max(s.d,window.SCENE_DUR[i])});
let acc=0;SC.forEach(s=>{s.S=acc;acc+=s.d});const TOTAL=acc;window.TOTAL=TOTAL;
const SS=SC.filter(s=>s.k==='step');const END_STEPS=SS[SS.length-1].S+SS[SS.length-1].d;
// group add times, mix windows, cook curve
const ADD={},MIXW={bowl:null,dish:null},COOK=[],STIR=[],FX=[];
SS.forEach(sc=>{const s=STEPS[sc.j];
 if(s.kind==='fill'||s.kind==='top'){const span=s.kind==='fill'?1.7:1.5;(s.batches||[]).forEach((b,bi)=>{const t=sc.S+.6+bi*span;(b.groups||[]).forEach(id=>{if(!(id in ADD))ADD[id]=t});if(b.fx)FX.push({fx:b.fx,t,step:sc.j,spice:b.spice})});
  if(s.mix){const nb=(s.batches||[]).length;const t0=sc.S+.6+nb*span;const key=s.target==='bowl'||V.container==='bowl'?'bowl':'dish';MIXW[key]=[t0,t0+2.1,s.mix];
   if(s.mix==='batter')GROUPS.forEach(g=>{if(g.reveal==='mix'&&cKey(g)===key)ADD[g.id]=t0+.8})}}
 if(s.kind==='bake'){COOK.push([sc.S+.8,sc.S+sc.d-1.2,s.cookTo??.92]);if(s.mid){const m=sc.S+sc.d/2;STIR.push([m-.4,m+2.2])}}
});
function cookAt(T){let c=0;for(const [a,b,to] of COOK){if(T>=b)c=to;else if(T>a){c=lerp(c,to,eio((T-a)/(b-a)));break}else break}return c}
const ADDCOOK={};for(const id in ADD)ADDCOOK[id]=cookAt(ADD[id]);
function mixAt(key,T){const w=MIXW[key];if(!w)return 0;return eio(pr(T,w[0],w[1]))}
function stirAt(T){for(const [a,b] of STIR)if(T>a&&T<b)return Math.sin(eio(pr(T,a,b))*Math.PI);return 0}
/* ---------- shapes ---------- */
function blobPath(r,seed,k=9,j=.12){const rr=rng(seed);let d='';const pts=[];for(let i=0;i<k;i++){const a=i/k*Math.PI*2;const q=r*(1+(rr()-.5)*2*j);pts.push([Math.cos(a)*q,Math.sin(a)*q])}
 for(let i=0;i<k;i++){const p=pts[i],n=pts[(i+1)%k];const m=[(p[0]+n[0])/2,(p[1]+n[1])/2];d+=(i===0?`M${((pts[k-1][0]+p[0])/2).toFixed(1)} ${((pts[k-1][1]+p[1])/2).toFixed(1)} `:'')+`Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${m[0].toFixed(1)} ${m[1].toFixed(1)} `}return d+'Z'}
const SHD='rgba(40,20,0,.26)';
function shape(sh,s,c0,c1,cook,seed,curl=1){
 const f=mix(c0,c1,cook),e=dark(c1,.25+cook*.2),hiA=.45;
 switch(sh){
 case 'cube':{const w=34*s,h=30*s,r=7*s;return `<rect x="${-w/2+2}" y="${-h/2+3}" width="${w}" height="${h}" rx="${r}" fill="${SHD}"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${r}" fill="${f}" stroke="${mix(dark(c0,.12),e,cook)}" stroke-width="${1.5+cook*1.5}"/><rect x="${-w/2+4*s}" y="${-h/2+4*s}" width="${w-12*s}" height="${h*.42}" rx="${r*.6}" fill="#fff" opacity="${hiA*.6}"/>`}
 case 'ball':{const r=18*s;return `<circle cx="2.5" cy="3.5" r="${r}" fill="${SHD}"/><circle r="${r}" fill="${f}" stroke="${mix(dark(c0,.15),e,cook)}" stroke-width="2"/><ellipse cx="${-r*.32}" cy="${-r*.35}" rx="${r*.42}" ry="${r*.28}" fill="#fff" opacity=".3"/>`}
 case 'pea':{const r=11*s;return `<ellipse cx="2" cy="3" rx="${r}" ry="${r*.92}" fill="${SHD}"/><ellipse rx="${r}" ry="${r*.92}" fill="${f}" stroke="${mix(dark(c0,.15),e,cook)}" stroke-width="1.4"/><ellipse cx="${-r*.3}" cy="${-r*.32}" rx="${r*.45}" ry="${r*.3}" fill="#fff" opacity=".3"/>`}
 case 'strip':{const p=`M${-24*s} 4 Q0 ${-20*curl*s} ${24*s} 4`;return `<path d="${p}" stroke="${SHD}" stroke-width="${13*s}" fill="none" stroke-linecap="round" transform="translate(2 3)"/><path d="${p}" stroke="${mix(dark(c0,.15),e,cook)}" stroke-width="${13*s}" fill="none" stroke-linecap="round"/><path d="${p}" stroke="${f}" stroke-width="${9*s}" fill="none" stroke-linecap="round"/>`}
 case 'arc':{const p=`M${-17*s} 2 Q0 ${-16*curl*s} ${17*s} 2`;return `<path d="${p}" stroke="${SHD}" stroke-width="${8*s}" fill="none" stroke-linecap="round" transform="translate(2 3)"/><path d="${p}" stroke="${mix(dark(c0,.15),e,cook)}" stroke-width="${8*s}" fill="none" stroke-linecap="round"/><path d="${p}" stroke="${f}" stroke-width="${5*s}" fill="none" stroke-linecap="round"/>`}
 case 'floret':{let o=`<circle cx="3" cy="4" r="${22*s}" fill="${SHD}"/><path d="M0 ${6*s} L${-5*s} ${24*s} L${5*s} ${24*s}Z" fill="${mix('#B8D98A','#C9B26A',cook)}"/>`;const P=[[0,-8],[-11,-2],[11,-2],[-6,8],[6,8],[0,0]];P.forEach(p=>{o+=`<circle cx="${p[0]*s}" cy="${p[1]*s}" r="${10*s}" fill="${f}" stroke="${mix(dark(c0,.12),e,cook)}" stroke-width="1.4"/>`});return o+`<circle cx="${-4*s}" cy="${-10*s}" r="${4*s}" fill="#fff" opacity=".25"/>`}
 case 'slice':{const rx=20*s,ry=17*s;return `<ellipse cx="2" cy="3" rx="${rx}" ry="${ry}" fill="${SHD}"/><ellipse rx="${rx}" ry="${ry}" fill="${f}" stroke="${mix(dark(c0,.18),e,cook)}" stroke-width="${2+cook*2}"/><ellipse rx="${rx*.62}" ry="${ry*.6}" fill="#fff" opacity=".18"/>`}
 case 'medallion':{const rx=40*s,ry=32*s;let o=`<ellipse cx="3" cy="5" rx="${rx}" ry="${ry}" fill="${SHD}"/><ellipse rx="${rx}" ry="${ry}" fill="${f}" stroke="${mix(dark(c0,.15),e,cook)}" stroke-width="${3+cook*2}"/>`;
  if(cook>.15)for(let i=-1;i<=1;i++)o+=`<path d="M${-rx*.6} ${i*11*s-6} L${rx*.6} ${i*11*s+6}" stroke="${dark(c1,.45)}" stroke-width="${4*s}" stroke-linecap="round" opacity="${clamp((cook-.15)*1.5)}"/>`;
  return o+`<ellipse cx="${-rx*.3}" cy="${-ry*.35}" rx="${rx*.35}" ry="${ry*.2}" fill="#fff" opacity=".25"/>`}
 case 'fillet':{const w=120*s,h=66*s;let o=`<rect x="${-w/2+3}" y="${-h/2+5}" width="${w}" height="${h}" rx="${h/2.4}" fill="${SHD}"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h/2.4}" fill="${f}" stroke="${mix(dark(c0,.15),dark(c1,.3),cook)}" stroke-width="3"/>`;
  for(let i=0;i<5;i++){const x=-w/2+18*s+i*20*s;o+=`<path d="M${x} ${-h/2+6} q${10*s} ${h/2-6} 0 ${h-12}" stroke="#fff" stroke-width="${3*s}" fill="none" opacity="${.55-cook*.25}"/>`}
  return o+`<rect x="${-w/2+8}" y="${-h/2+6}" width="${w-16}" height="${h*.22}" rx="${h*.1}" fill="#fff" opacity=".18"/>`}
 case 'egg':{const a=.6+cook*.4;return `<path d="${blobPath(38*s,seed,8,.16)}" fill="${SHD}" transform="translate(2 4)"/><path d="${blobPath(38*s,seed,8,.16)}" fill="#FFFFFF" opacity="${a}" stroke="#F0E6D6" stroke-width="2"/><circle cx="3" cy="2" r="${15*s}" fill="${mix('#F9A11B','#F2A93B',cook)}" stroke="#E08A0E" stroke-width="2"/><ellipse cx="${-2*s}" cy="${-3*s}" rx="${5*s}" ry="${3.4*s}" fill="#fff" opacity=".55"/>`}
 case 'yolk':{return `<circle r="${26*s}" fill="#FFFFFF" opacity=".6"/><circle r="${15*s}" fill="#F9A11B" stroke="#E08A0E" stroke-width="2"/><ellipse cx="${-4*s}" cy="${-4*s}" rx="${5*s}" ry="${3*s}" fill="#fff" opacity=".6"/>`}
 case 'leaf':{const L=15*s;return `<path d="M0 ${-L} Q${L*.85} ${-L*.2} 0 ${L} Q${-L*.85} ${-L*.2} 0 ${-L}Z" fill="${SHD}" transform="translate(2 3)"/><path d="M0 ${-L} Q${L*.85} ${-L*.2} 0 ${L} Q${-L*.85} ${-L*.2} 0 ${-L}Z" fill="${f}" stroke="${dark(c1,.2)}" stroke-width="1.3"/><path d="M0 ${-L*.8} V${L*.8}" stroke="${dark(c1,.25)}" stroke-width="1.3"/>`}
 case 'bean':{return `<ellipse cx="2" cy="3" rx="${12*s}" ry="${8*s}" fill="${SHD}"/><ellipse rx="${12*s}" ry="${8*s}" fill="${f}" stroke="${mix(dark(c0,.15),e,cook)}" stroke-width="1.3"/><path d="M${-5*s} ${-2*s} q${5*s} ${-3*s} ${10*s} 0" stroke="#fff" stroke-width="1.5" fill="none" opacity=".45"/>`}
 case 'berry':{const r=10*s;return `<circle cx="1.5" cy="2.5" r="${r}" fill="${SHD}"/><circle r="${r}" fill="${f}"/><circle cx="${-r*.35}" cy="${-r*.35}" r="${r*.3}" fill="#fff" opacity=".35"/>`}
 case 'wedge':{const p=`M${-24*s} ${6*s} Q0 ${-26*s} ${24*s} ${6*s} Q0 ${14*s} ${-24*s} ${6*s}Z`;return `<path d="${p}" fill="${SHD}" transform="translate(2 3)"/><path d="${p}" fill="${f}" stroke="${mix('#B98A3E',dark(c1,.35),cook)}" stroke-width="${2.5+cook*1.5}"/><path d="M${-14*s} ${0} Q0 ${-14*s} ${14*s} 0" stroke="#fff" stroke-width="2" fill="none" opacity=".3"/>`}
 case 'mushroom':{const p=`M${-16*s} 0 Q${-16*s} ${-16*s} 0 ${-16*s} Q${16*s} ${-16*s} ${16*s} 0 L${6*s} 0 L${6*s} ${12*s} L${-6*s} ${12*s} L${-6*s} 0Z`;return `<path d="${p}" fill="${SHD}" transform="translate(2 3)"/><path d="${p}" fill="${f}" stroke="${mix(dark(c0,.2),dark(c1,.3),cook)}" stroke-width="1.6"/><path d="M${-11*s} ${-2*s} Q0 ${-12*s} ${11*s} ${-2*s}" stroke="${mix(dark(c0,.25),dark(c1,.35),cook)}" stroke-width="1.4" fill="none"/>`}
 case 'greenbean':{const p=`M${-27*s} 0 Q0 ${-8*curl*s} ${27*s} 0`;return `<path d="${p}" stroke="${SHD}" stroke-width="${9*s}" fill="none" stroke-linecap="round" transform="translate(2 3)"/><path d="${p}" stroke="${dark(c1,.15)}" stroke-width="${9*s}" fill="none" stroke-linecap="round"/><path d="${p}" stroke="${f}" stroke-width="${6*s}" fill="none" stroke-linecap="round"/>`}
